name: Nightly batch

on:
  schedule:
    # UTC 18:17 = 北京时间 02:17；避开整点的调度高峰。
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      lives-per-cell:
        description: 每层局数（80 层；125 => 10,000 局）
        required: false
        default: '125'

permissions:
  contents: read

concurrency:
  group: nightly-batch
  cancel-in-progress: false

jobs:
  batch:
    name: Stratified batch over five country packs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run stratified batch
        env:
          LIVES_PER_CELL: ${{ github.event.inputs.lives-per-cell || '125' }}
        run: >-
          pnpm --filter @lifesim/cli batch
          --lives-per-cell "$LIVES_PER_CELL"
          --out "$GITHUB_WORKSPACE/batch-report.json"
      - name: Upload batch report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: batch-report
          path: batch-report.json
          retention-days: 90
          if-no-files-found: warn
